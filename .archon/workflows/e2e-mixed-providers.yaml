# E2E smoke test — Pi provider all nodes
# Verifies: provider selection, sendQuery, structured output across all node types
name: e2e-pi-all-nodes-smoke
description: "E2E smoke test for Pi provider. Exercises prompt, command, bash, script, loop, and approval nodes."
provider: pi

nodes:
  # 1. Prompt node
  - id: prompt-node
    prompt: "Say 'pi-ok' and nothing else."
    idle_timeout: 30000

  # 2. Structured output node
  - id: structured-node
    prompt: "Classify this input as 'math' or 'text': '2+2=4'. Return JSON only."
    output_format:
      type: object
      properties:
        category:
          type: string
          enum: ["math", "text"]
      required: ["category"]
      additionalProperties: false
    idle_timeout: 30000
    depends_on: [prompt-node]

  # 3. Assert both nodes returned output
  - id: assert
    bash: |
      prompt_out="${prompt-node.output}"
      structured_out="${structured-node.output}"
      if [ -z "$prompt_out" ]; then
        echo "FAIL: prompt-node returned empty output"
        exit 1
      fi
      if [ -z "$structured_out" ]; then
        echo "FAIL: structured-node returned empty output"
        exit 1
      fi
      echo "PASS: prompt=$prompt_out structured=$structured_out"
    depends_on: [prompt-node, structured-node]
